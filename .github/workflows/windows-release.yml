name: Windows Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    
    - name: Set up Python 3.11
      run: uv python install 3.11
    
    - name: Install dependencies
      run: uv sync --locked --group dev
    
    - name: Install packaging tools
      run: uv pip install pyinstaller
    
    - name: Run tests
      run: uv run python -m pytest -v
    
    - name: Build Windows executable
      run: uv run pyinstaller kanslordash.spec --clean
    
    - name: Verify build outputs
      shell: pwsh
      run: |
        if (-not (Test-Path "dist/KANSLORDASH/KANSLORDASH.exe")) {
          Write-Error "KANSLORDASH.exe not found"
          exit 1
        }
        Write-Host "Executable found"
        Get-ChildItem dist/KANSLORDASH/ | Measure-Object | Select-Object Count
    
    - name: Smoke test executable
      shell: pwsh
      run: |
        $exe = "dist/KANSLORDASH/KANSLORDASH.exe"
        if (-not (Test-Path $exe)) {
          Write-Error "KANSLORDASH.exe not found for smoke test"
          exit 1
        }
        $proc = Start-Process -FilePath $exe -ArgumentList "--version" -NoNewWindow -Wait -PassThru
        Write-Host "Exit code: $($proc.ExitCode)"
        if ($proc.ExitCode -ne 0) {
          Write-Error "Smoke test failed: --version returned exit code $($proc.ExitCode)"
          exit 1
        }
        $proc2 = Start-Process -FilePath $exe -ArgumentList "--help" -NoNewWindow -Wait -PassThru
        Write-Host "Help exit code: $($proc2.ExitCode)"
        if ($proc2.ExitCode -ne 0) {
          Write-Error "Smoke test failed: --help returned exit code $($proc2.ExitCode)"
          exit 1
        }
    
    - name: Create portable ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path "dist/KANSLORDASH/*" -DestinationPath "KANSLORDASH-v1.0.0-windows-x64.zip" -Force
    
    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup --yes --no-progress
    
    - name: Build installer
      shell: pwsh
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
        & $iscc "installer\kanslordash.iss"
    
    - name: Verify installer
      shell: pwsh
      run: |
        if (-not (Test-Path "dist/installer/KANSLORDASH-Setup-x64.exe")) {
          Write-Error "Installer not found"
          exit 1
        }
        Write-Host "Installer created"
        Get-Item "dist/installer/KANSLORDASH-Setup-x64.exe" | Select-Object Name, Length
    
    - name: Generate checksums
      shell: pwsh
      run: |
        $files = @("KANSLORDASH-v1.0.0-windows-x64.zip", "dist/installer/KANSLORDASH-Setup-x64.exe")
        foreach ($f in $files) {
          $hash = Get-FileHash -Algorithm SHA256 $f
          $hash.Hash + "  " + (Split-Path $f -Leaf) | Out-File -Encoding ASCII "$f.sha256"
          Get-Content "$f.sha256"
        }
    
    - name: Verify checksums
      shell: pwsh
      run: |
        $files = @("KANSLORDASH-v1.0.0-windows-x64.zip", "dist/installer/KANSLORDASH-Setup-x64.exe")
        foreach ($f in $files) {
          $expected = (Get-Content "$f.sha256" -Raw).Trim()
          $actual = (Get-FileHash -Algorithm SHA256 $f).Hash + "  " + (Split-Path $f -Leaf)
          if ($expected -ne $actual) { Write-Error "Checksum verification failed for $f"; exit 1 }
        }
        Write-Host "All checksums verified"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KANSLORDASH-v1.0.0-windows-x64
        path: |
          KANSLORDASH-v1.0.0-windows-x64.zip
          KANSLORDASH-v1.0.0-windows-x64.zip.sha256
          dist/installer/KANSLORDASH-Setup-x64.exe
          dist/installer/KANSLORDASH-Setup-x64.exe.sha256
        if-no-files-found: error
