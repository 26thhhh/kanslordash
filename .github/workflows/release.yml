name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Validate tag version and determine release
      id: version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag.TrimStart('v')
        $py = (Select-String -Path "pyproject.toml" -Pattern 'version = "(.+)"').Matches.Groups[1].Value
        Write-Host "Tag: $tag, Py: $py"
        if ($version -ne $py) { Write-Error "Tag version mismatch"; exit 1 }
        $zipName = "KANSLORDASH-v$version-windows-x64.zip"
        "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "ZIP: $zipName"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    
    - name: Set up Python 3.11
      run: uv python install 3.11
    
    - name: Install dependencies
      run: uv sync --locked --group dev
    
    - name: Install packaging tools
      run: uv pip install pyinstaller
    
    - name: Run tests
      run: uv run python -m pytest -v
    
    - name: Build Windows executable
      run: uv run pyinstaller kanslordash.spec --clean
    
    - name: Smoke test executable
      shell: pwsh
      run: |
        $exe = "dist/KANSLORDASH/KANSLORDASH.exe"
        $proc = Start-Process -FilePath $exe -ArgumentList "--version" -NoNewWindow -Wait -PassThru
        if ($proc.ExitCode -ne 0) { exit 1 }
        $proc2 = Start-Process -FilePath $exe -ArgumentList "--help" -NoNewWindow -Wait -PassThru
        if ($proc2.ExitCode -ne 0) { exit 1 }
    
    - name: Create portable ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path "dist/KANSLORDASH/*" -DestinationPath "$env:ZIP_NAME" -Force
    
    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup --yes --no-progress
    
    - name: Build installer
      shell: pwsh
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
        & $iscc "installer\kanslordash.iss"
    
    - name: Generate checksums
      shell: pwsh
      run: |
        $files = @("$env:ZIP_NAME", "dist/installer/KANSLORDASH-Setup-x64.exe")
        foreach ($f in $files) {
          $hash = Get-FileHash -Algorithm SHA256 $f
          $hash.Hash + "  " + (Split-Path $f -Leaf) | Out-File -Encoding ASCII "$f.sha256"
        }
    
    - name: Verify checksums
      shell: pwsh
      run: |
        $files = @("$env:ZIP_NAME", "dist/installer/KANSLORDASH-Setup-x64.exe")
        foreach ($f in $files) {
          $expected = (Get-Content "$f.sha256" -Raw).Trim()
          $actual = (Get-FileHash -Algorithm SHA256 $f).Hash + "  " + (Split-Path $f -Leaf)
          if ($expected -ne $actual) { Write-Error "Checksum verification failed for $f"; exit 1 }
        }
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.ZIP_NAME }}
          ${{ env.ZIP_NAME }}.sha256
          dist/installer/KANSLORDASH-Setup-x64.exe
          dist/installer/KANSLORDASH-Setup-x64.exe.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
